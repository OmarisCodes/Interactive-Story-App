<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race App Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #e2e600;
        }

        #timerDisplay {
            font-size: 3.5em;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            font-size: 2em;
            margin: 5px;
            padding: 10px 20px;
            cursor: pointer;
            -webkit-appearance: button;
            -moz-appearance: button;
            appearance: button;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f5f5f5;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #00aeff;
        }

        h1, h2 {
            margin-bottom: 10px;
        }

        ul#runnerList {
            list-style-type: none;
            padding: 0;
            margin: 20px auto;
            max-width: 400px;
            text-align: left;
        }

        ul#runnerList li {
            background: #fafafa;
            margin-bottom: 8px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        ul#runnerList li input[type="text"] {
            flex-grow: 1;
            font-size: 1em;
            border: none;
            background: transparent;
            outline: none;
            padding: 4px 8px;
            border-bottom: 1px solid #ccc;
        }

        ul#runnerList li input[type="text"]:focus {
            border-bottom-color: #666;
        }

        @media (max-width: 480px) {
            #timerDisplay {
                font-size: 2.5em;
            }
            button {
                font-size: 1em;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
    <h1>Race Timer</h1>
    <div id="timerDisplay">00:00:00.000</div>
    <button id="buttonStartRace">Start</button>
    <button id="buttonStopTimer">Stop</button>
    <button id="buttonResetTimer">Reset Time</button>




    <h2>Runners</h2>
    <button id="buttonFinishingTime">Record Finish Time</button>
    <button id="buttonUploadResults">Upload The Results</button>
    <button id="buttonExportCSV">Export Csv</button>
    <button id="buttonClearResults">Clear The Results</button>
    <ul id="runnerList"></ul>



    <script src="script.js"></script>


</body>
</html>
